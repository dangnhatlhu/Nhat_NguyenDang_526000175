<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="300" height="300">
  <defs>
    <linearGradient id="bodyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7c4dff"/>
      <stop offset="50%" stop-color="#b388ff"/>
      <stop offset="100%" stop-color="#512da8"/>
    </linearGradient>
    <radialGradient id="lensGrad" cx="40%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </radialGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-opacity="0.25"/>
    </filter>
  </defs>
  
  <!-- Vivo V60 5G Body -->
  <g transform="translate(85, 30)" filter="url(#shadow)">
    <!-- Phone Back -->
    <rect x="0" y="0" width="130" height="240" rx="20" fill="url(#bodyGrad)" stroke="#d8b4fe" stroke-width="2"/>
    
    <!-- Camera Island (Oreo / Rounded pill) -->
    <rect x="15" y="15" width="45" height="90" rx="22" fill="#1e1b4b" stroke="#6366f1" stroke-width="1.5"/>
    
    <!-- Lenses -->
    <circle cx="37" cy="38" r="14" fill="#000000"/>
    <circle cx="37" cy="38" r="10" fill="url(#lensGrad)"/>
    <circle cx="35" cy="36" r="3" fill="#ffffff" opacity="0.8"/>
    
    <circle cx="37" cy="68" r="14" fill="#000000"/>
    <circle cx="37" cy="68" r="10" fill="url(#lensGrad)"/>
    <circle cx="35" cy="66" r="3" fill="#ffffff" opacity="0.8"/>
    
    <!-- Flash ring -->
    <circle cx="37" cy="92" r="6" fill="#fef08a" stroke="#ca8a04" stroke-width="1.5"/>
    
    <!-- ZEISS badge -->
    <rect x="68" y="20" width="36" height="14" rx="3" fill="#004bb5"/>
    <text x="86" y="30" text-anchor="middle" font-family="sans-serif" font-size="8" font-weight="900" fill="#ffffff">ZEISS</text>

    <!-- Vivo logo bottom -->
    <text x="65" y="215" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="14" font-weight="bold" fill="#f5f3ff" letter-spacing="2">vivo</text>
  </g>
</svg>
