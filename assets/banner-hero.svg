<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff8d6"/>
      <stop offset="50%" stop-color="#ffec99"/>
      <stop offset="100%" stop-color="#ffd400"/>
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#004bb5"/>
      <stop offset="100%" stop-color="#0077ff"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="2" dy="4" stdDeviation="4" flood-opacity="0.15"/>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="320" rx="12" fill="url(#bgGrad)"/>
  
  <!-- Decorative bubbles -->
  <circle cx="950" cy="80" r="140" fill="#ffffff" opacity="0.4"/>
  <circle cx="200" cy="240" r="90" fill="#ffffff" opacity="0.4"/>
  <circle cx="1120" cy="220" r="70" fill="#ffc107" opacity="0.3"/>
  
  <!-- Left Side: Big 10.10 Typography -->
  <g transform="translate(60, 40)">
    <rect x="-10" y="-10" width="380" height="250" rx="16" fill="#ffffff" opacity="0.75" filter="url(#shadow)"/>
    <text x="180" y="80" text-anchor="middle" font-family="'Impact', 'Arial Black', sans-serif" font-size="78" fill="#d0021b" font-weight="900" letter-spacing="-2">10.10</text>
    <text x="180" y="130" text-anchor="middle" font-family="'Segoe UI', Roboto, sans-serif" font-size="30" font-weight="900" fill="#004bb5" letter-spacing="1">NGÀY ĐÔI</text>
    <rect x="30" y="150" width="300" height="48" rx="24" fill="#d0021b"/>
    <text x="180" y="184" text-anchor="middle" font-family="'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="900" fill="#ffffff" letter-spacing="2">SALE ĐẠIIII</text>
  </g>
  
  <!-- Center Main Promo text -->
  <g transform="translate(480, 50)">
    <rect x="0" y="0" width="300" height="32" rx="16" fill="#d0021b"/>
    <text x="150" y="22" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="900" fill="#ffffff">DUY NHẤT 10.10</text>
    
    <text x="150" y="65" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="700" fill="#333333">ĐIỆN THOẠI | TABLET | LAPTOP</text>
    <text x="150" y="115" text-anchor="middle" font-family="sans-serif" font-size="34" font-weight="900" fill="#d0021b">GIẢM THÊM ĐẾN 10%</text>
    
    <!-- Sub Promo Badges -->
    <rect x="-30" y="145" width="165" height="44" rx="8" fill="#ffd400" stroke="#f59e0b" stroke-width="2"/>
    <text x="52" y="163" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="700" fill="#333">Apple giảm đến</text>
    <text x="52" y="180" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="900" fill="#d0021b">3.500.000₫</text>
    
    <rect x="150" y="145" width="175" height="44" rx="8" fill="#ffd400" stroke="#f59e0b" stroke-width="2"/>
    <text x="237" y="163" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="700" fill="#333">Phụ kiện - Đồng hồ</text>
    <text x="237" y="180" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="900" fill="#d0021b">GIẢM ĐẾN 20%</text>

    <text x="150" y="215" text-anchor="middle" font-family="sans-serif" font-size="11" font-style="italic" fill="#666666">Áp dụng kèm khuyến mãi khác</text>
  </g>
  
  <!-- Right Side: Gadget Device Showcase -->
  <g transform="translate(860, 40)">
    <!-- Laptop silhouette -->
    <rect x="20" y="60" width="130" height="90" rx="6" fill="#334155" filter="url(#shadow)"/>
    <rect x="25" y="65" width="120" height="80" rx="3" fill="#0284c7"/>
    <rect x="10" y="150" width="150" height="10" rx="3" fill="#64748b"/>
    <!-- Phone silhouette -->
    <rect x="165" y="40" width="60" height="120" rx="10" fill="#0f172a" stroke="#cbd5e1" stroke-width="2" filter="url(#shadow)"/>
    <rect x="170" y="48" width="50" height="104" rx="6" fill="#ec4899"/>
    <!-- Headphones -->
    <path d="M70,40 A50,50 0 0,1 150,40" stroke="#475569" stroke-width="8" fill="none"/>
    <rect x="60" y="30" width="16" height="26" rx="6" fill="#334155"/>
    <rect x="144" y="30" width="16" height="26" rx="6" fill="#334155"/>
    <!-- CTA Button -->
    <rect x="80" y="185" width="140" height="42" rx="21" fill="#d0021b" filter="url(#shadow)"/>
    <text x="150" y="211" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="900" fill="#ffffff">MUA NGAY ›</text>
  </g>
</svg>
